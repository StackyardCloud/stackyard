services:
  stackyard:
    build:
      context: ../../../
      dockerfile: Dockerfile
    container_name: stackyard-data-mesh-gcp
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  backend:
    build:
      context: ./
      dockerfile: backend/Dockerfile
    depends_on:
      - stackyard
    environment:
      - APP_ADDR=:8080
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - DATA_MESH_DOMAIN_PREFIX=ra-data-mesh-gcp
    ports:
      - "8282:8080"
