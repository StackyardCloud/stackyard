services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  sesv2-basic:
    build:
      context: ../../..
      dockerfile: examples/sesv2/sesv2-basic/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_SOURCE_EMAIL=sender@example.com
      - STACKYARD_DEST_EMAIL=recipient@example.com
