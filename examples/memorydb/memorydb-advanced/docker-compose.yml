services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  memorydb-advanced:
    build:
      context: ../../..
      dockerfile: examples/memorydb/memorydb-advanced/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_MEMORYDB_CLUSTER=memorydb-advanced-cluster
      - STACKYARD_MEMORYDB_ACL=memorydb-advanced-acl
