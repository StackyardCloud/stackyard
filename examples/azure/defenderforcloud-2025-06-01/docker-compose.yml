services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  defenderforcloud:
    build:
      context: ../../..
      dockerfile: examples/azure/defenderforcloud-2025-06-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DEFENDERFORCLOUD_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DEFENDERFORCLOUD_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_DEFENDERFORCLOUD_RESOURCE_ID=/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/SampleRG/providers/Microsoft.Storage/storageAccounts/samplestorageaccount
      - STACKYARD_AZURE_DEFENDERFORCLOUD_SETTING_NAME=current
      - STACKYARD_AZURE_DEFENDERFORCLOUD_SCAN_ID=latest
