services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  datalakeanalytics:
    build:
      context: ../../..
      dockerfile: examples/azure/datalakeanalytics-2016-11-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DATALAKEANALYTICS_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DATALAKEANALYTICS_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-datalakeanalytics
      - STACKYARD_AZURE_LOCATION=eastus2
      - STACKYARD_AZURE_DATALAKEANALYTICS_ACCOUNT_NAME=contosoadla
