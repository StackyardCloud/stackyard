services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  communication-advancedmessaging-2024-08-30:
    build:
      context: ../../..
      dockerfile: examples/azure/communication-advancedmessaging-2024-08-30/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_COMMUNICATION_ADVANCEDMESSAGING_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_COMMUNICATION_ADVANCEDMESSAGING_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_COMMUNICATION_ADVANCEDMESSAGING_CHANNEL_ID=11111111-1111-4111-8111-111111111111
