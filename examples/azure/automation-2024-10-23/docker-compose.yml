services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  automation-2024-10-23:
    build:
      context: ../../..
      dockerfile: examples/azure/automation-2024-10-23/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AUTOMATION_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AUTOMATION_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-automation
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_AUTOMATION_ACCOUNT_NAME=aa-example
