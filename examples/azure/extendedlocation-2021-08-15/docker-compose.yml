services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  extendedlocation:
    build:
      context: ../../..
      dockerfile: examples/azure/extendedlocation-2021-08-15/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_EXTENDEDLOCATION_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_EXTENDEDLOCATION_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-extendedlocation
      - STACKYARD_AZURE_LOCATION=westus
      - STACKYARD_AZURE_EXTENDEDLOCATION_RESOURCE_NAME=customLocation01
