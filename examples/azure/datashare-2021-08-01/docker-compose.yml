services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  datashare:
    build:
      context: ../../..
      dockerfile: examples/azure/datashare-2021-08-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DATASHARE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DATASHARE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-datashare
      - STACKYARD_AZURE_LOCATION=eastus2
      - STACKYARD_AZURE_DATASHARE_ACCOUNT_NAME=datashare-account-example
      - STACKYARD_AZURE_DATASHARE_SHARE_NAME=datashare-share-example
      - STACKYARD_AZURE_DATASHARE_INVITATION_NAME=datashare-invitation-example
      - STACKYARD_AZURE_DATASHARE_DATA_SET_NAME=datashare-dataset-example
      - STACKYARD_AZURE_DATASHARE_SYNC_SETTING_NAME=datashare-sync-setting-example
      - STACKYARD_AZURE_DATASHARE_SHARE_SUBSCRIPTION_NAME=datashare-subscription-example
      - STACKYARD_AZURE_DATASHARE_DATA_SET_MAPPING_NAME=datashare-mapping-example
      - STACKYARD_AZURE_DATASHARE_TRIGGER_NAME=datashare-trigger-example
      - STACKYARD_AZURE_DATASHARE_PROVIDER_SHARE_SUBSCRIPTION_ID=11111111-1111-1111-1111-111111111111
      - STACKYARD_AZURE_DATASHARE_CONSUMER_INVITATION_ID=22222222-2222-2222-2222-222222222222
      - STACKYARD_AZURE_DATASHARE_SYNCHRONIZATION_ID=33333333-3333-3333-3333-333333333333
      - STACKYARD_AZURE_DATASHARE_SOURCE_DATA_SET_ID=44444444-4444-4444-4444-444444444444
