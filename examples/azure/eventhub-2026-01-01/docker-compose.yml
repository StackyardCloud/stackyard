services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  eventhub:
    build:
      context: ../../..
      dockerfile: examples/azure/eventhub-2026-01-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_EVENTHUB_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_EVENTHUB_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-eventhub
      - STACKYARD_AZURE_LOCATION=eastus
      - STACKYARD_AZURE_EVENTHUB_NAMESPACE_NAME=eventhub-namespace01
      - STACKYARD_AZURE_EVENTHUB_NAME=eventhub01
      - STACKYARD_AZURE_EVENTHUB_CONSUMER_GROUP_NAME=cg01
