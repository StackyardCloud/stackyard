services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  sitemanager-2023-07-01-preview:
    build:
      context: ../../..
      dockerfile: examples/azure/sitemanager-2023-07-01-preview/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_SITEMANAGER_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_SITEMANAGER_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-site-manager
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_SITEMANAGER_SITE=site-a
