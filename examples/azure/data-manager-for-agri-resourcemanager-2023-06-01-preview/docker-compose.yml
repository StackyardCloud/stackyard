services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  data-manager-for-agri-resourcemanager-2023-06-01-preview:
    build:
      context: ../../..
      dockerfile: examples/azure/data-manager-for-agri-resourcemanager-2023-06-01-preview/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AGRI_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AGRI_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-agri
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_FARMBEATS_NAME=farm-a
