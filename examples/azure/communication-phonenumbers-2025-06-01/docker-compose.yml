services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  communication-phonenumbers-2025-06-01:
    build:
      context: ../../..
      dockerfile: examples/azure/communication-phonenumbers-2025-06-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_COMMUNICATION_PHONENUMBERS_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_COMMUNICATION_PHONENUMBERS_SUBSCRIPTION_KEY=stackyard-local-subscription-key
