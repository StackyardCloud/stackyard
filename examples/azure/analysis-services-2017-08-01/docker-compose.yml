services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  analysis-services-2017-08-01:
    build:
      context: ../../..
      dockerfile: examples/azure/analysis-services-2017-08-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AISERVICES_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AISERVICES_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-analysis-services
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_ANALYSIS_SERVICES_SERVER=stackyard-aas
      - STACKYARD_AZURE_ANALYSIS_SERVICES_OPERATION_ID=operation-123
