services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  attestation-2025-06-01:
    build:
      context: ../../..
      dockerfile: examples/azure/attestation-2025-06-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_ATTESTATION_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_ATTESTATION_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_ATTESTATION_INSTANCE_URL=http://stackyard:4566/attestation
