services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  eventgrid-namespace:
    build:
      context: ../../..
      dockerfile: examples/azure/eventgrid-namespace-2024-06-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_EVENTGRID_NAMESPACE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_EVENTGRID_NAMESPACE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_EVENTGRID_NAMESPACE_ENDPOINT=myNamespaceName.westus-1.eventgrid.azure.net
      - STACKYARD_AZURE_EVENTGRID_NAMESPACE_TOPIC_NAME=myTopic
      - STACKYARD_AZURE_EVENTGRID_NAMESPACE_EVENT_SUBSCRIPTION_NAME=myEventSubscription
      - STACKYARD_AZURE_EVENTGRID_NAMESPACE_LOCK_TOKEN=CgMKATESCQoHdG9rZW4tMQ==
