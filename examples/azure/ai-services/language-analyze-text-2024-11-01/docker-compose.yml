services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  ai-services-language-analyze-text-2024-11-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/ai-services/language-analyze-text-2024-11-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AISERVICES_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AISERVICES_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_LANGUAGE_ANALYZE_TEXT_KIND=SentimentAnalysis
      - STACKYARD_AZURE_LANGUAGE_ANALYZE_TEXT_LANGUAGE=en
      - STACKYARD_AZURE_LANGUAGE_ANALYZE_TEXT_DOCUMENT=The food was delicious and the staff was friendly.
