services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  ai-services-language-analyze-conversations-2024-11-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/ai-services/language-analyze-conversations-2024-11-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AISERVICES_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AISERVICES_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_LANGUAGE_ANALYZE_CONVERSATIONS_PROJECT=customer-support
      - STACKYARD_AZURE_LANGUAGE_ANALYZE_CONVERSATIONS_DEPLOYMENT=production
      - STACKYARD_AZURE_LANGUAGE_ANALYZE_CONVERSATIONS_TEXT=Hello, I need help with my billing issue.
      - STACKYARD_AZURE_LANGUAGE_ANALYZE_CONVERSATIONS_JOB_ID=job-123
