services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  computer-vision-v4.0-preview2023-04-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/ai-services/computer-vision-v4.0-preview2023-04-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AISERVICES_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AISERVICES_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_COMPUTER_VISION_DATASET=dataset-a
      - STACKYARD_AZURE_COMPUTER_VISION_MODEL=model-a
      - STACKYARD_AZURE_COMPUTER_VISION_EVALUATION=eval-a
      - STACKYARD_AZURE_COMPUTER_VISION_RUN=run-a
