services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  text-to-speech-2024-04-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/ai-services/text-to-speech-2024-04-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AISERVICES_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AISERVICES_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_TEXT_TO_SPEECH_JOB_ID=synth-1
      - STACKYARD_AZURE_TEXT_TO_SPEECH_OPERATION_ID=op-123
