services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  search-service-data-plane-synonym-maps-2025-09-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/search-service/search-service-data-plane-synonym-maps-2025-09-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_SEARCH_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_SEARCH_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SEARCH_SYNONYM_MAP=hotels-synonyms
      - STACKYARD_AZURE_SEARCH_SYNONYMS_DATA=usa, united states\nhotel, lodging
