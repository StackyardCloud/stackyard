services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  content-safety-2024-09-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/ai-services/content-safety-2024-09-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_CONTENT_SAFETY_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_CONTENT_SAFETY_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_CONTENT_SAFETY_BLOCKLIST=local-list
      - STACKYARD_AZURE_CONTENT_SAFETY_BLOCKLIST_ITEM_ID=item-1
      - STACKYARD_AZURE_CONTENT_SAFETY_IMAGE_URL=https://example.com/safe-image.jpg
      - STACKYARD_AZURE_CONTENT_SAFETY_TEXT=hello world
