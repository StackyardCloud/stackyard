services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  communication-networktraversal-2022-03-01-preview:
    build:
      context: ../../..
      dockerfile: examples/azure/communication-networktraversal-2022-03-01-preview/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_COMMUNICATION_NETWORKTRAVERSAL_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_COMMUNICATION_NETWORKTRAVERSAL_SUBSCRIPTION_KEY=stackyard-local-subscription-key
