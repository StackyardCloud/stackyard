services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  containerapps-2025-10-02-preview:
    build:
      context: ../../..
      dockerfile: examples/azure/containerapps-2025-10-02-preview/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_CONTAINER_APPS_DATA_PLANE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_CONTAINER_APPS_DATA_PLANE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_CONTAINER_APPS_DATA_PLANE_IDENTIFIER=session-a
