services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  resource-manager-2024-06-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/app-configuration/resource-manager-2024-06-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_APPCONFIG_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_APPCONFIG_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-appcfg
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_APPCONFIG_STORE=cfg-store
      - STACKYARD_AZURE_APPCONFIG_KEYVALUE=featureA
      - STACKYARD_AZURE_APPCONFIG_PRIVATE_ENDPOINT_CONNECTION=pec-a
      - STACKYARD_AZURE_APPCONFIG_PRIVATE_LINK_GROUP=configStore
      - STACKYARD_AZURE_APPCONFIG_REPLICA=replica-a
      - STACKYARD_AZURE_APPCONFIG_SNAPSHOT=snapshot-a
