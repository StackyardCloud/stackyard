services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  data-plane-2024-09-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/app-configuration/data-plane-2024-09-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_APPCONFIG_DATA_PLANE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_APPCONFIG_DATA_PLANE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_APPCONFIG_DATA_PLANE_KEY=Message
      - STACKYARD_AZURE_APPCONFIG_DATA_PLANE_SNAPSHOT=Prod-2022-08-01
