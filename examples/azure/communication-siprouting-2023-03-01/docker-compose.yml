services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  communication-siprouting-2023-03-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/communication-siprouting-2023-03-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_COMMUNICATION_SIPROUTING_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_COMMUNICATION_SIPROUTING_SUBSCRIPTION_KEY=stackyard-local-subscription-key
