services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  dataprotection:
    build:
      context: ../../..
      dockerfile: examples/azure/dataprotection-2026-03-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DATAPROTECTION_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DATAPROTECTION_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-dataprotection
      - STACKYARD_AZURE_LOCATION=westus
      - STACKYARD_AZURE_DATAPROTECTION_VAULT_NAME=dp-vault-example
      - STACKYARD_AZURE_DATAPROTECTION_POLICY_NAME=dp-policy-example
      - STACKYARD_AZURE_DATAPROTECTION_BACKUP_INSTANCE_NAME=dp-bi-example
      - STACKYARD_AZURE_DATAPROTECTION_JOB_ID=00000000-0000-0000-0000-000000000001
      - STACKYARD_AZURE_DATAPROTECTION_OPERATION_ID=00000000-0000-0000-0000-000000000002
      - STACKYARD_AZURE_DATAPROTECTION_DELETED_VAULT_NAME=deleted-vault-01
