services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  datamigration:
    build:
      context: ../../..
      dockerfile: examples/azure/datamigration-2022-03-30-preview/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DATAMIGRATION_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DATAMIGRATION_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-datamigration
      - STACKYARD_AZURE_LOCATION=eastus
      - STACKYARD_AZURE_DATAMIGRATION_SERVICE_NAME=dms-example
      - STACKYARD_AZURE_DATAMIGRATION_PROJECT_NAME=project-example
      - STACKYARD_AZURE_DATAMIGRATION_SERVICE_TASK_NAME=service-task-example
      - STACKYARD_AZURE_DATAMIGRATION_TASK_NAME=task-example
      - STACKYARD_AZURE_DATAMIGRATION_FILE_NAME=payload.json
