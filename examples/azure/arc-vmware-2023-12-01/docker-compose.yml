services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  arc-vmware-2023-12-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/arc-vmware-2023-12-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_ARC_VMWARE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_ARC_VMWARE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-arc-vmware
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_ARC_VMWARE_VCENTER=vcenter-a
      - STACKYARD_AZURE_ARC_VMWARE_CLUSTER=cluster-a
      - STACKYARD_AZURE_ARC_VMWARE_VM=machine-a
