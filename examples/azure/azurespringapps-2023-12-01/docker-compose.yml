services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  azurespringapps-2023-12-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/azurespringapps-2023-12-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_SPRING_APPS_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_SPRING_APPS_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-spring
      - STACKYARD_AZURE_SPRING_SERVICE_NAME=spring-a
      - STACKYARD_AZURE_SPRING_APP_NAME=app-a
      - STACKYARD_AZURE_SPRING_DEPLOYMENT_NAME=deployment-a
