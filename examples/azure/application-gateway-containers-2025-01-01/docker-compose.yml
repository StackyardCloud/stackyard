services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  application-gateway-containers-2025-01-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/application-gateway-containers-2025-01-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_APPLICATION_GATEWAY_CONTAINERS_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_APPLICATION_GATEWAY_CONTAINERS_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-servicenetworking
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_AGFC_TRAFFIC_CONTROLLER=tc-a
      - STACKYARD_AZURE_AGFC_FRONTEND=fe-a
      - STACKYARD_AZURE_AGFC_ASSOCIATION=as-a
      - STACKYARD_AZURE_AGFC_SECURITY_POLICY=sp-a
