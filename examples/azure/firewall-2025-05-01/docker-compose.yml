services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  firewall:
    build:
      context: ../../..
      dockerfile: examples/azure/firewall-2025-05-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_FIREWALL_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_FIREWALL_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-firewall
      - STACKYARD_AZURE_LOCATION=eastus
      - STACKYARD_AZURE_FIREWALL_NAME=azfw01
      - STACKYARD_AZURE_FIREWALL_POLICY_NAME=fwpolicy01
      - STACKYARD_AZURE_FIREWALL_RULE_COLLECTION_GROUP_NAME=rcg01
      - STACKYARD_AZURE_FIREWALL_WEB_CATEGORY_NAME=General
