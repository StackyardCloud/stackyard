services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  migrate-projects-2018-09-01-preview:
    build:
      context: ../../../..
      dockerfile: examples/azure/migrate-projects-2018-09-01-preview/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_MIGRATE_PROJECTS_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_MIGRATE_PROJECTS_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-migrate-projects
      - STACKYARD_AZURE_MIGRATE_PROJECTS_NAME=project-a
