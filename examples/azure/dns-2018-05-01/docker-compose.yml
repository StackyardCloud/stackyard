services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  dns:
    build:
      context: ../../..
      dockerfile: examples/azure/dns-2018-05-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DNS_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DNS_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-dns
      - STACKYARD_AZURE_DNS_ZONE_NAME=example.com
      - STACKYARD_AZURE_DNS_RECORD_TYPE=A
      - STACKYARD_AZURE_DNS_RELATIVE_RECORD_SET_NAME=www
      - STACKYARD_AZURE_DNS_TARGET_RESOURCE_ID=/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-dns/providers/Microsoft.Network/trafficManagerProfiles/tm-profile1
