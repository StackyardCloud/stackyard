services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  data-manager-for-agri-dataplane-2023-11-01-preview:
    build:
      context: ../../..
      dockerfile: examples/azure/data-manager-for-agri-dataplane-2023-11-01-preview/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AGRI_DATA_PLANE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AGRI_DATA_PLANE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_AGRI_PARTY_ID=party-a
