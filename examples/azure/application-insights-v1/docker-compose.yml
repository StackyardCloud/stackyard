services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  application-insights-v1:
    build:
      context: ../../..
      dockerfile: examples/azure/application-insights-v1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_APPLICATION_INSIGHTS_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_APPLICATION_INSIGHTS_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_APPLICATION_INSIGHTS_APP_ID=app-123
