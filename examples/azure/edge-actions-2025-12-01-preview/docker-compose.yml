services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  edge-actions-2025-12-01-preview:
    build:
      context: ../../../..
      dockerfile: examples/azure/edge-actions-2025-12-01-preview/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_EDGE_ACTIONS_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_EDGE_ACTIONS_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-edge-actions
      - STACKYARD_AZURE_LOCATION=global
      - STACKYARD_AZURE_EDGE_ACTION_NAME=edgeAction1
      - STACKYARD_AZURE_EDGE_ACTION_VERSION=version1
      - STACKYARD_AZURE_EDGE_ACTION_EXECUTION_FILTER=executionFilter1
      - STACKYARD_AZURE_EDGE_ACTION_VERSION_CODE_NAME=zippedFile
      - STACKYARD_AZURE_EDGE_ACTION_VERSION_CODE_CONTENT=UEsDBBQAAAAIAI1NzkQAAAAABQAAAA==
      - STACKYARD_AZURE_EDGE_ACTION_HEADER_NAME=x-edge-filter
      - STACKYARD_AZURE_EDGE_ACTION_HEADER_VALUE=blue
