services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  deviceprovisioningservices-2022-02-05:
    build:
      context: ../../..
      dockerfile: examples/azure/deviceprovisioningservices-2022-02-05/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-dps-example
      - STACKYARD_AZURE_REGION=eastus
