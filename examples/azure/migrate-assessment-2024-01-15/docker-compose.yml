services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  migrate-assessment-2024-01-15:
    build:
      context: ../../../..
      dockerfile: examples/azure/migrate-assessment-2024-01-15/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_MIGRATE_ASSESSMENT_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_MIGRATE_ASSESSMENT_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-migrate
      - STACKYARD_AZURE_MIGRATE_ASSESSMENT_PROJECT_NAME=project-a
      - STACKYARD_AZURE_MIGRATE_ASSESSMENT_GROUP_NAME=group-a
      - STACKYARD_AZURE_MIGRATE_ASSESSMENT_NAME=assessment-a
