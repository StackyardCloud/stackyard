services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  playwright-dataplane-2025-09-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/playwright-dataplane-2025-09-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_PLAYWRIGHT_DATA_PLANE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_PLAYWRIGHT_DATA_PLANE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_PLAYWRIGHT_DATA_PLANE_WORKSPACE_ID=11111111-1111-1111-1111-111111111111
      - STACKYARD_AZURE_PLAYWRIGHT_DATA_PLANE_ACCESS_TOKEN_ID=token-abc
      - STACKYARD_AZURE_PLAYWRIGHT_DATA_PLANE_RUN_ID=22222222-2222-2222-2222-222222222222
