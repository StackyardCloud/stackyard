services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  loadtesting-dataplane-2022-11-01:
    build:
      context: ../../../..
      dockerfile: examples/azure/loadtesting-dataplane-2022-11-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_LOADTESTING_DATA_PLANE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_LOADTESTING_DATA_PLANE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_LOADTESTING_TEST_ID=test-a
      - STACKYARD_AZURE_LOADTESTING_TEST_RUN_ID=run-a
