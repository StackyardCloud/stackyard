services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  dtl:
    build:
      context: ../../..
      dockerfile: examples/azure/dtl-2018-09-15/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DTL_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DTL_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-dtl
      - STACKYARD_AZURE_LOCATION=eastus2
      - STACKYARD_AZURE_DTL_LAB_NAME=lab-a
      - STACKYARD_AZURE_DTL_USER_NAME=user-a
      - STACKYARD_AZURE_DTL_ARTIFACT_SOURCE_NAME=public-repo
      - STACKYARD_AZURE_DTL_ARM_TEMPLATE_NAME=template-a
      - STACKYARD_AZURE_DTL_ARTIFACT_NAME=linux-install-nodejs
      - STACKYARD_AZURE_DTL_COST_NAME=lab-cost
      - STACKYARD_AZURE_DTL_CUSTOM_IMAGE_NAME=custom-image-a
      - STACKYARD_AZURE_DTL_FORMULA_NAME=formula-a
      - STACKYARD_AZURE_DTL_NOTIFICATION_CHANNEL_NAME=channel-a
      - STACKYARD_AZURE_DTL_POLICY_SET_NAME=default
      - STACKYARD_AZURE_DTL_POLICY_NAME=labVmCount
      - STACKYARD_AZURE_DTL_SCHEDULE_NAME=schedule-a
      - STACKYARD_AZURE_DTL_SERVICE_RUNNER_NAME=runner-a
      - STACKYARD_AZURE_DTL_DISK_NAME=disk-a
      - STACKYARD_AZURE_DTL_ENVIRONMENT_NAME=env-a
      - STACKYARD_AZURE_DTL_SECRET_NAME=secret-a
      - STACKYARD_AZURE_DTL_SERVICE_FABRIC_NAME=sf-a
      - STACKYARD_AZURE_DTL_SERVICE_FABRIC_SCHEDULE_NAME=sf-schedule-a
      - STACKYARD_AZURE_DTL_VM_NAME=vm-a
      - STACKYARD_AZURE_DTL_VM_SCHEDULE_NAME=vm-schedule-a
      - STACKYARD_AZURE_DTL_VNET_NAME=vnet-a
      - STACKYARD_AZURE_DTL_OPERATION_NAME=operation-a
