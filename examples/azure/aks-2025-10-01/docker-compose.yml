services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  aks-2025-10-01:
    build:
      context: ../../..
      dockerfile: examples/azure/aks-2025-10-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_AISERVICES_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_AISERVICES_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-aks
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_AKS_CLUSTER=cluster-a
      - STACKYARD_AZURE_AKS_AGENT_POOL=system
      - STACKYARD_AZURE_AKS_SNAPSHOT=snapshot-a
      - STACKYARD_AZURE_AKS_MANAGED_NAMESPACE=ns-a
