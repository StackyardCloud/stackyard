services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  expressroute:
    build:
      context: ../../..
      dockerfile: examples/azure/expressroute-2025-05-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_EXPRESSROUTE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_EXPRESSROUTE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-expressroute
      - STACKYARD_AZURE_LOCATION=westus
      - STACKYARD_AZURE_EXPRESSROUTE_CIRCUIT_NAME=circuit01
      - STACKYARD_AZURE_EXPRESSROUTE_AUTHORIZATION_NAME=authorization01
      - STACKYARD_AZURE_EXPRESSROUTE_PEERING_NAME=AzurePrivatePeering
      - STACKYARD_AZURE_EXPRESSROUTE_CONNECTION_NAME=connection01
      - STACKYARD_AZURE_EXPRESSROUTE_DEVICE_PATH=primary
      - STACKYARD_AZURE_EXPRESSROUTE_CROSS_CONNECTION_NAME=crossconnection01
      - STACKYARD_AZURE_EXPRESSROUTE_PORT_NAME=port01
      - STACKYARD_AZURE_EXPRESSROUTE_LINK_NAME=link1
      - STACKYARD_AZURE_EXPRESSROUTE_LOCATION_NAME=SiliconValley
      - STACKYARD_AZURE_EXPRESSROUTE_PROVIDER_PORT_NAME=providerport01
      - STACKYARD_AZURE_EXPRESSROUTE_ROUTE_FILTER_NAME=routefilter01
      - STACKYARD_AZURE_EXPRESSROUTE_RULE_NAME=rule01
      - STACKYARD_AZURE_EXPRESSROUTE_SERVICE_ENDPOINT_POLICY_NAME=policy01
      - STACKYARD_AZURE_EXPRESSROUTE_SERVICE_ENDPOINT_POLICY_DEFINITION_NAME=definition01
