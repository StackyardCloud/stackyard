services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  application-gateway-2025-05-01:
    build:
      context: ../../..
      dockerfile: examples/azure/application-gateway-2025-05-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_APPLICATION_GATEWAY_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_APPLICATION_GATEWAY_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-net
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_APPLICATION_GATEWAY_NAME=appgw-a
      - STACKYARD_AZURE_APPLICATION_GATEWAY_SSL_POLICY=AppGwSslPolicy20220101
