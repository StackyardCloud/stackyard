services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  devcenter-developer:
    build:
      context: ../../..
      dockerfile: examples/azure/devcenter-developer-2025-02-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_PROJECT_NAME=myProject
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_USER_ID=me
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_ENVIRONMENT_NAME=myEnvironment
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_ENVIRONMENT_TYPE=DevTest
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_CATALOG_NAME=main
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_ENVIRONMENT_DEFINITION_NAME=helloworld
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_DEVBOX_NAME=myDevBox
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_POOL_NAME=LargeDevWorkStationPool
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_CUSTOMIZATION_GROUP_NAME=Provisioning
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_CUSTOMIZATION_TASK_ID=91835dc0-ef5a-4f58-9e3a-099aea8481f4
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_IMAGE_BUILD_LOG_ID=91835dc0-ef5a-4f58-9e3a-099aea8481f4
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_ENV_OPERATION_ID=f5dbdfab-fa0e-4831-8d13-25359aa5e680
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_DEVBOX_OPERATION_ID=f5dbdfab-fa0e-4831-8d13-25359aa5e680
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_OPERATION_STATUS_ID=fa067167-e49d-41bd-8dd8-de719b9de3b3
      - STACKYARD_AZURE_DEVCENTER_DEVELOPER_DELAY_UNTIL=2026-01-01T18:00:00Z
