services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  elasticsan:
    build:
      context: ../../..
      dockerfile: examples/azure/elasticsan-2025-09-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_ELASTICSAN_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_ELASTICSAN_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-elasticsan
      - STACKYARD_AZURE_LOCATION=eastus
      - STACKYARD_AZURE_ELASTICSAN_NAME=esanexample01
      - STACKYARD_AZURE_ELASTICSAN_VOLUME_GROUP_NAME=volumegroup01
      - STACKYARD_AZURE_ELASTICSAN_VOLUME_NAME=volume01
      - STACKYARD_AZURE_ELASTICSAN_SNAPSHOT_NAME=snapshot01
      - STACKYARD_AZURE_ELASTICSAN_PRIVATE_ENDPOINT_CONNECTION_NAME=privateendpointconnection01
      - STACKYARD_AZURE_ELASTICSAN_PRIVATE_ENDPOINT_NAME=private-endpoint-01
      - STACKYARD_AZURE_ELASTICSAN_VNET_NAME=esan-vnet
      - STACKYARD_AZURE_ELASTICSAN_SUBNET_NAME=esan-subnet
      - STACKYARD_AZURE_ELASTICSAN_DISK_SNAPSHOT_NAME=disk-snapshot-01
      - STACKYARD_AZURE_ELASTICSAN_MANAGED_BY_VM_NAME=esan-vm
