services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  datalakestore:
    build:
      context: ../../..
      dockerfile: examples/azure/datalakestore-2016-11-01/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_DATALAKESTORE_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_DATALAKESTORE_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-datalakestore
      - STACKYARD_AZURE_LOCATION=eastus2
      - STACKYARD_AZURE_DATALAKESTORE_ACCOUNT_NAME=contosoadls
      - STACKYARD_AZURE_DATALAKESTORE_FIREWALL_RULE_NAME=rule-example
      - STACKYARD_AZURE_DATALAKESTORE_TRUSTED_ID_PROVIDER_NAME=trusted-id-provider-example
      - STACKYARD_AZURE_DATALAKESTORE_VNET_RULE_NAME=vnet-rule-example
