services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,azure
      - STACKYARD_AZURE_AUTH_MODE=shared_key

  arc-scvmm-2025-03-13:
    build:
      context: ../../../..
      dockerfile: examples/azure/arc-scvmm-2025-03-13/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_AZURE_ARC_SCVMM_ACCOUNT=devstoreaccount1
      - STACKYARD_AZURE_ARC_SCVMM_SUBSCRIPTION_KEY=stackyard-local-subscription-key
      - STACKYARD_AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000
      - STACKYARD_AZURE_RESOURCE_GROUP=rg-arc-scvmm
      - STACKYARD_AZURE_REGION=eastus
      - STACKYARD_AZURE_ARC_SCVMM_VMM_SERVER=vmm-a
      - STACKYARD_AZURE_ARC_SCVMM_CLOUD=cloud-a
      - STACKYARD_AZURE_ARC_SCVMM_VM=machine-a
