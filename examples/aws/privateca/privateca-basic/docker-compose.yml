services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  privateca-basic:
    build:
      context: ../../../..
      dockerfile: examples/aws/privateca/privateca-basic/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_CA_ARN=arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/stackyard
