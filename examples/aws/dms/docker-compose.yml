services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  dms:
    build:
      context: ../../../..
      dockerfile: examples/aws/dms/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - AWS_REGION=us-east-1
      - STACKYARD_DMS_INSTANCE_ARN=arn:aws:dms:us-east-1:123456789012:rep:stackyard-replication-instance
