services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  sns:
    build:
      context: ../../../..
      dockerfile: examples/aws/sns/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_TOPIC=demo-sns
      - STACKYARD_SMS_NUMBER=+15555550123
      - STACKYARD_SMS_OTP=000000
      - STACKYARD_SUB_ENDPOINT=demo@example.com
