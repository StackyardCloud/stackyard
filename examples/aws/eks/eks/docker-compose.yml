services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  eks:
    build:
      context: ../../../..
      dockerfile: examples/aws/eks/eks/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_CLUSTER_NAME=eks-cluster
      - STACKYARD_NODEGROUP_NAME=eks-nodegroup
      - STACKYARD_ROLE_ARN=arn:aws:iam::123456789012:role/stackyard-eks
      - STACKYARD_CLUSTER_ARN=arn:aws:eks:us-east-1:123456789012:cluster/eks-cluster
