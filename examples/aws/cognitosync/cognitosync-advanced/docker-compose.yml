services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  cognitosync-advanced:
    build:
      context: ../../../..
      dockerfile: examples/aws/cognitosync/cognitosync-advanced/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_IDENTITY_POOL_ID=us-east-1:stackyard-pool
      - STACKYARD_IDENTITY_ID=us-east-1:stackyard-identity
      - STACKYARD_DATASET_NAME=profile
      - STACKYARD_DEVICE_ID=device-001
