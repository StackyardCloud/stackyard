services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  ec2-advanced:
    build:
      context: ../../../..
      dockerfile: examples/aws/ec2/ec2-advanced/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_IMAGE_ID=ami-12345678
      - STACKYARD_SECURITY_GROUP=ec2-advanced-sg
