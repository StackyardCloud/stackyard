services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  cloudwatchinvestigations:
    build:
      context: ../../../..
      dockerfile: examples/aws/cloudwatchinvestigations/cloudwatchinvestigations/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - AWS_REGION=us-east-1
      - STACKYARD_INVESTIGATION_GROUP_ID=stackyard-investigation-group
