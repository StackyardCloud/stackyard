services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  rtb-fabric:
    build:
      context: ../../../..
      dockerfile: examples/aws/rtb-fabric/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - AWS_REGION=us-east-1
      - STACKYARD_RTB_FABRIC_GATEWAY_ID=stackyard-gateway
      - STACKYARD_RTB_FABRIC_LINK_ID=stackyard-link
      - STACKYARD_RTB_FABRIC_RESOURCE_ARN=arn:aws:rtb-fabric:us-east-1:123456789012:requester-gateway/stackyard-gateway
