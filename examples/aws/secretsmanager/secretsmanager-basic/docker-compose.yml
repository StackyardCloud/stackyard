services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  secretsmanager-basic:
    build:
      context: ../../../..
      dockerfile: examples/aws/secretsmanager/secretsmanager-basic/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_SECRET_ID=arn:aws:secretsmanager:us-east-1:123456789012:secret:stackyard-secret-AbCdEf
