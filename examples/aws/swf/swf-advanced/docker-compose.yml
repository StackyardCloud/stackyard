services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  swf-advanced:
    build:
      context: ../../../..
      dockerfile: examples/aws/swf/swf-advanced/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_DOMAIN=demo-swf-advanced
      - STACKYARD_WORKFLOW=demo-workflow-advanced
      - STACKYARD_WORKFLOW_VERSION=1
      - STACKYARD_ACTIVITY=demo-activity-advanced
      - STACKYARD_ACTIVITY_VERSION=1
      - STACKYARD_TASK_LIST=advanced-tasks
