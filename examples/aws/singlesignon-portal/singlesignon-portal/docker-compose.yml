services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  singlesignon-portal:
    build:
      context: ../../../..
      dockerfile: examples/aws/singlesignon-portal/singlesignon-portal/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - SSO_ACCESS_TOKEN=stackyard-access-token
      - SSO_ACCOUNT_ID=123456789012
      - SSO_ROLE_NAME=stackyard-role
