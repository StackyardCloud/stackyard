services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  dynamodb-basic:
    build:
      context: ../../../..
      dockerfile: examples/aws/dynamodb/dynamodb-basic/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_DDB_TABLE=stackyard-ddb-basic
