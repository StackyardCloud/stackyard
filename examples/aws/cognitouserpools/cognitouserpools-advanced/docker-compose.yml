services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  cognitouserpools-advanced:
    build:
      context: ../../../..
      dockerfile: examples/aws/cognitouserpools/cognitouserpools-advanced/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - AWS_REGION=us-east-1
      - STACKYARD_USER_POOL_NAME=stackyard-cognito-advanced
