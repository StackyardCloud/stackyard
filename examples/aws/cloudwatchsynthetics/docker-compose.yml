services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  cloudwatchsynthetics:
    build:
      context: ../../../..
      dockerfile: examples/aws/cloudwatchsynthetics/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - AWS_REGION=us-east-1
      - STACKYARD_CANARY_NAME=stackyard-canary
      - STACKYARD_GROUP_NAME=stackyard-group
