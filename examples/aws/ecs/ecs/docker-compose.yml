services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  ecs:
    build:
      context: ../../../..
      dockerfile: examples/aws/ecs/ecs/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_CLUSTER_NAME=ecs-cluster
      - STACKYARD_TASK_FAMILY=ecs-task
      - STACKYARD_SERVICE_NAME=ecs-service
      - STACKYARD_NAMESPACE=ecs-ns
