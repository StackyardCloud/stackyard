services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  routing-control:
    build:
      context: ../../../..
      dockerfile: examples/aws/routing-control/routing-control/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - AWS_REGION=us-west-2
      - STACKYARD_ROUTING_CONTROL_ARN=arn:aws:route53-recovery-control::123456789012:routingcontrol/stackyard-routing-control
