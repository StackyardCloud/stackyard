services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  batch-advanced:
    build:
      context: ../../../..
      dockerfile: examples/aws/batch/batch-advanced/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_COMPUTE_ENV=batch-advanced-ce
      - STACKYARD_JOB_QUEUE=batch-advanced-queue
      - STACKYARD_SCHEDULING_POLICY=batch-advanced-policy
      - STACKYARD_JOB_DEFINITION=batch-advanced-jobdef
