services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  securesourcemanager-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/securesourcemanager-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_INSTANCE_ID=instance-1
      - STACKYARD_GCP_REPOSITORY_ID=repository-1
      - STACKYARD_GCP_HOOK_ID=hook-1
      - STACKYARD_GCP_PULL_REQUEST_ID=pull-request-1
      - STACKYARD_GCP_ISSUE_ID=issue-1
