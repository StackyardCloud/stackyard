services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  gkebackup-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/gkebackup-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_GKEBACKUP_CLUSTER_ID=primary
      - STACKYARD_GCP_GKEBACKUP_BACKUP_PLAN_ID=plan-a
      - STACKYARD_GCP_GKEBACKUP_BACKUP_CHANNEL_ID=channel-a
      - STACKYARD_GCP_GKEBACKUP_BACKUP_BINDING_ID=binding-a
      - STACKYARD_GCP_GKEBACKUP_BACKUP_ID=backup-a
      - STACKYARD_GCP_GKEBACKUP_VOLUME_BACKUP_ID=volume-backup-a
      - STACKYARD_GCP_GKEBACKUP_RESTORE_PLAN_ID=restore-plan-a
      - STACKYARD_GCP_GKEBACKUP_RESTORE_CHANNEL_ID=restore-channel-a
      - STACKYARD_GCP_GKEBACKUP_RESTORE_BINDING_ID=restore-binding-a
      - STACKYARD_GCP_GKEBACKUP_RESTORE_ID=restore-a
      - STACKYARD_GCP_GKEBACKUP_VOLUME_RESTORE_ID=volume-restore-a
      - STACKYARD_GCP_GKEBACKUP_OPERATION_ID=op-1
      - STACKYARD_GCP_GKEBACKUP_DESTINATION_PROJECT=projects/123456789012
