services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  shopping-merchant-accounts-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/shopping-merchant-accounts-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MERCHANT_ACCOUNT_ID=123456
      - STACKYARD_GCP_MERCHANT_USER_ID=owner@example.com
      - STACKYARD_GCP_MERCHANT_PROGRAM_ID=free-listings
      - STACKYARD_GCP_MERCHANT_REGION_ID=us-east
