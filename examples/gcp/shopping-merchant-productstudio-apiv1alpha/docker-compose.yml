services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  shopping-merchant-productstudio-apiv1alpha:
    build:
      context: ../../../..
      dockerfile: examples/gcp/shopping-merchant-productstudio-apiv1alpha/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MERCHANT_PRODUCTSTUDIO_ACCOUNT_ID=123456
