services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  managedkafka-schemaregistry-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/managedkafka-schemaregistry-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_MANAGEDKAFKA_SCHEMAREGISTRY_ID=sr1
      - STACKYARD_GCP_MANAGEDKAFKA_SCHEMAREGISTRY_CONTEXT=default
      - STACKYARD_GCP_MANAGEDKAFKA_SCHEMAREGISTRY_SUBJECT=orders-value
      - STACKYARD_GCP_MANAGEDKAFKA_SCHEMAREGISTRY_VERSION=latest
      - STACKYARD_GCP_MANAGEDKAFKA_SCHEMAREGISTRY_SCHEMA_ID=1
      - STACKYARD_GCP_MANAGEDKAFKA_SCHEMAREGISTRY_OPERATION_ID=op-1
