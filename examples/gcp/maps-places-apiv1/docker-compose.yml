services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  maps-places-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/maps-places-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MAPS_PLACE_ID=ChIJj61dQgK6j4AR4GeTYWZsKWw
      - STACKYARD_GCP_MAPS_PHOTO_REF=AW123
