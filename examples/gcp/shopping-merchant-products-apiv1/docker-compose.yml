services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  shopping-merchant-products-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/shopping-merchant-products-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MERCHANT_PRODUCTS_ACCOUNT_ID=123456
      - STACKYARD_GCP_MERCHANT_PRODUCTS_DATASOURCE_ID=104628
      - STACKYARD_GCP_MERCHANT_PRODUCTS_OFFER_ID=sku-1001
      - STACKYARD_GCP_MERCHANT_PRODUCTS_CONTENT_LANGUAGE=en
      - STACKYARD_GCP_MERCHANT_PRODUCTS_FEED_LABEL=US
