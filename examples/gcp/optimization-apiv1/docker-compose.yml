services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  optimization-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/optimization-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_OPTIMIZATION_OPERATION_NAME=operations/opt-op-1
      - STACKYARD_GCP_OPTIMIZATION_INPUT_URI=gs://stackyard-optimization/input.json
      - STACKYARD_GCP_OPTIMIZATION_OUTPUT_URI=gs://stackyard-optimization/output/
