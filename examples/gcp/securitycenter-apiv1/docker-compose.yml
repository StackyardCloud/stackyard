services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  securitycenter-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/securitycenter-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_ORGANIZATION_ID=123456
      - STACKYARD_GCP_SOURCE_ID=source-1
      - STACKYARD_GCP_FINDING_ID=finding-1
      - STACKYARD_GCP_MUTE_CONFIG_ID=mute-config-1
      - STACKYARD_GCP_NOTIFICATION_CONFIG_ID=notify-1
      - STACKYARD_GCP_BIGQUERY_EXPORT_ID=export-1
      - STACKYARD_GCP_OPERATION_ID=op-1
