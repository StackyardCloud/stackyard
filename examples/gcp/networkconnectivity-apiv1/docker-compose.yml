services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  networkconnectivity-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/networkconnectivity-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_NETWORKCONNECTIVITY_HUB_ID=hub-a
      - STACKYARD_GCP_NETWORKCONNECTIVITY_SCM_ID=scm-a
      - STACKYARD_GCP_NETWORKCONNECTIVITY_INTERNAL_RANGE_ID=range-a
      - STACKYARD_GCP_NETWORKCONNECTIVITY_PBR_ID=pbr-a
      - STACKYARD_GCP_NETWORKCONNECTIVITY_TRANSFER_CONFIG_ID=transfer-a
