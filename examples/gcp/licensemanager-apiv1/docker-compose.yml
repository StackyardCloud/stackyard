services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  licensemanager-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/licensemanager-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_LICENSEMANAGER_CONFIGURATION_ID=config-1
      - STACKYARD_GCP_LICENSEMANAGER_INSTANCE_ID=instance-1
      - STACKYARD_GCP_LICENSEMANAGER_PRODUCT_ID=product-1
