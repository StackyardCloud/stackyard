services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  compute-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/compute-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_COMPUTE_ZONE=us-central1-a
      - STACKYARD_GCP_COMPUTE_INSTANCE_ID=team-vm
      - STACKYARD_GCP_COMPUTE_NETWORK_ID=team-network
      - STACKYARD_GCP_COMPUTE_ZONE_OPERATION_ID=op-zone-1
      - STACKYARD_GCP_COMPUTE_GLOBAL_OPERATION_ID=op-global-1
