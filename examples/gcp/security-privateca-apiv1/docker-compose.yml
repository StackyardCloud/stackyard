services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  security-privateca-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/security-privateca-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_CA_POOL_ID=pool-1
      - STACKYARD_GCP_CA_ID=ca-1
      - STACKYARD_GCP_CERTIFICATE_ID=cert-1
      - STACKYARD_GCP_CERTIFICATE_TEMPLATE_ID=template-1
