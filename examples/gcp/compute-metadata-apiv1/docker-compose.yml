services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=bearer_required

  compute-metadata-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/compute-metadata-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - GCE_METADATA_HOST=stackyard:4566
      - STACKYARD_GCP_METADATA_PROJECT_ATTRIBUTE=env
      - STACKYARD_GCP_METADATA_INSTANCE_ATTRIBUTE=role
