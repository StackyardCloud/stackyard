services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  shopping-merchant-lfp-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/shopping-merchant-lfp-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MERCHANT_LFP_ACCOUNT_ID=123456
      - STACKYARD_GCP_MERCHANT_LFP_TARGET_ACCOUNT_ID=567890
      - STACKYARD_GCP_MERCHANT_LFP_STORE_CODE=store-nyc
      - STACKYARD_GCP_MERCHANT_LFP_OFFER_ID=offer-1001
      - STACKYARD_GCP_MERCHANT_LFP_REGION_CODE=US
      - STACKYARD_GCP_MERCHANT_LFP_CONTENT_LANGUAGE=en
