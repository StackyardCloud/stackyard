services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  mediatranslation-apiv1beta1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/mediatranslation-apiv1beta1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MEDIATRANSLATION_SOURCE_LANG=en-US
      - STACKYARD_GCP_MEDIATRANSLATION_TARGET_LANG=es-ES
      - STACKYARD_GCP_MEDIATRANSLATION_AUDIO_ENCODING=linear16
