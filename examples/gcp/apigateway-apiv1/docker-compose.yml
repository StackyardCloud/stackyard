services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  apigateway-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/apigateway-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PARENT_GLOBAL=projects/stackyard/locations/global
      - STACKYARD_GCP_GATEWAY_PARENT=projects/stackyard/locations/us-central1
      - STACKYARD_GCP_API_ID=team-api
      - STACKYARD_GCP_CONFIG_ID=team-config
      - STACKYARD_GCP_GATEWAY_ID=team-gateway
