services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  shopping-merchant-promotions-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/shopping-merchant-promotions-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MERCHANT_PROMOTIONS_ACCOUNT_ID=123456
      - STACKYARD_GCP_MERCHANT_PROMOTIONS_DATASOURCE_ID=104628
      - STACKYARD_GCP_MERCHANT_PROMOTIONS_ID=promo-1001
      - STACKYARD_GCP_MERCHANT_PROMOTIONS_CONTENT_LANGUAGE=en
      - STACKYARD_GCP_MERCHANT_PROMOTIONS_TARGET_COUNTRY=US
