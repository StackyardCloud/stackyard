services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  oslogin-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/oslogin-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_OSLOGIN_USER=alice@example.com
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_OSLOGIN_FINGERPRINT=fingerprint-1
