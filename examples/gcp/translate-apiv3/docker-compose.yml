services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  translate-apiv3:
    build:
      context: ../../../..
      dockerfile: examples/gcp/translate-apiv3/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_TRANSLATE_GLOSSARY_ID=glossary-1
      - STACKYARD_GCP_TRANSLATE_DATASET_ID=dataset-1
      - STACKYARD_GCP_TRANSLATE_ADAPTIVE_DATASET_ID=adaptive-dataset-1
      - STACKYARD_GCP_TRANSLATE_MODEL_ID=model-1
