services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  apigeeconnect-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/apigeeconnect-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_APIGEE_ENDPOINT=projects/stackyard/endpoints/local-endpoint
      - STACKYARD_GCP_PROJECT=projects/stackyard
