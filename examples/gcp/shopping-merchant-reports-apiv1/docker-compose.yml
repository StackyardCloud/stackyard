services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  shopping-merchant-reports-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/shopping-merchant-reports-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MERCHANT_REPORTS_ACCOUNT_ID=123456
      - STACKYARD_GCP_MERCHANT_REPORTS_QUERY=SELECT product_view.id, product_view.title FROM product_view
