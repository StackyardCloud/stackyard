services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  essentialcontacts-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/essentialcontacts-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_ESSENTIALCONTACTS_CONTACT_ID=ops-primary
      - STACKYARD_GCP_ESSENTIALCONTACTS_EMAIL=platform-oncall@example.com
