services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  maps-solar-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/maps-solar-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_SOLAR_LAT=37.7937
      - STACKYARD_GCP_SOLAR_LNG=-122.3965
      - STACKYARD_GCP_SOLAR_RADIUS_METERS=100
      - STACKYARD_GCP_SOLAR_GEOTIFF_ID=sample-geotiff-id
