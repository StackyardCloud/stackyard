services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  iap-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/iap-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_PROJECT_NUMBER=123456789
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_IAP_BRAND_ID=brand-1
      - STACKYARD_GCP_IAP_CLIENT_ID=client-1
      - STACKYARD_GCP_IAP_DEST_GROUP_ID=corp-dest
