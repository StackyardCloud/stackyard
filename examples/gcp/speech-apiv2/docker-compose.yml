services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  speech-apiv2:
    build:
      context: ../../../..
      dockerfile: examples/gcp/speech-apiv2/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_SPEECH_V2_RECOGNIZER_ID=recognizer-1
      - STACKYARD_GCP_SPEECH_V2_CUSTOM_CLASS_ID=custom-class-1
      - STACKYARD_GCP_SPEECH_V2_PHRASE_SET_ID=phrase-set-1
