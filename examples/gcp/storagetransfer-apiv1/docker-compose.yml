services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  storagetransfer-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/storagetransfer-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_STORAGE_TRANSFER_JOB_ID=job-1
      - STACKYARD_GCP_STORAGE_TRANSFER_AGENT_POOL_ID=agentpool-1
