services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  gaming-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/gaming-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=global
      - STACKYARD_GCP_GAMING_REALM_ID=team-realm
      - STACKYARD_GCP_GAMING_CLUSTER_ID=team-cluster
      - STACKYARD_GCP_GAMING_DEPLOYMENT_ID=team-deployment
      - STACKYARD_GCP_GAMING_CONFIG_ID=config-1
