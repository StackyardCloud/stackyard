services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  edgenetwork-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/edgenetwork-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_EDGENETWORK_ZONE_ID=us-central1-a
      - STACKYARD_GCP_EDGENETWORK_NETWORK_ID=mesh-network
      - STACKYARD_GCP_EDGENETWORK_SUBNET_ID=mesh-subnet
      - STACKYARD_GCP_EDGENETWORK_INTERCONNECT_ID=edge-ic
      - STACKYARD_GCP_EDGENETWORK_ATTACHMENT_ID=edge-attach
      - STACKYARD_GCP_EDGENETWORK_ROUTER_ID=edge-router
      - STACKYARD_GCP_EDGENETWORK_OPERATION_ID=op-1
