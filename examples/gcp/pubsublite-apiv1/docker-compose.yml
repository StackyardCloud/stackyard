services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  pubsublite-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/pubsublite-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_PUBSUBLITE_TOPIC_ID=orders-lite
      - STACKYARD_GCP_PUBSUBLITE_SUBSCRIPTION_ID=orders-lite-sub
      - STACKYARD_GCP_PUBSUBLITE_RESERVATION_ID=orders-lite-reservation
