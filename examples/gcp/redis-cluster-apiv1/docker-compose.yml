services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  redis-cluster-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/redis-cluster-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_CLUSTER_ID=cluster-1
      - STACKYARD_GCP_BACKUP_COLLECTION_ID=collection-1
      - STACKYARD_GCP_BACKUP_ID=backup-1
