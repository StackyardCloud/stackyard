services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  servicehealth-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/servicehealth-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT=stackyard
      - STACKYARD_GCP_LOCATION=global
      - STACKYARD_GCP_ORGANIZATION=123456789
