services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  managedidentities-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/managedidentities-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_MANAGEDIDENTITIES_DOMAIN=corp.stackyard.internal
      - STACKYARD_GCP_MANAGEDIDENTITIES_NETWORK=projects/stackyard/global/networks/default
      - STACKYARD_GCP_MANAGEDIDENTITIES_TRUST_TARGET_DOMAIN=trusted.stackyard.internal
      - STACKYARD_GCP_MANAGEDIDENTITIES_TRUST_TARGET_DNS=10.0.0.53
