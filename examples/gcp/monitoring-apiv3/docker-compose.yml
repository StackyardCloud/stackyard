services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  monitoring-apiv3:
    build:
      context: ../../../..
      dockerfile: examples/gcp/monitoring-apiv3/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_MONITORING_GROUP_ID=group-1
      - STACKYARD_GCP_MONITORING_SERVICE_ID=service-a
