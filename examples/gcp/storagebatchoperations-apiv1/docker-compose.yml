services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  storagebatchoperations-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/storagebatchoperations-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_STORAGE_BATCH_JOB_ID=job-1
      - STACKYARD_GCP_STORAGE_BATCH_BUCKET_OPERATION_ID=bucket-op-1
