services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  automl-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/automl-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_LOCATION=projects/stackyard/locations/us-central1
      - STACKYARD_GCP_DATASET_ID=team-dataset
      - STACKYARD_GCP_MODEL_ID=team-model
      - STACKYARD_GCP_MODEL_EVALUATION_ID=eval-1
