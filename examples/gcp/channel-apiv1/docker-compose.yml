services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  channel-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/channel-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_CHANNEL_ACCOUNT=accounts/stackyard-account
      - STACKYARD_GCP_CHANNEL_CUSTOMER_ID=team-customer
      - STACKYARD_GCP_CHANNEL_REPORT_ID=613bf59q
      - STACKYARD_GCP_CHANNEL_REPORT_JOB_ID=team-report-job
