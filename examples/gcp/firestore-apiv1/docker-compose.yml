services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  firestore-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/firestore-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_FIRESTORE_DATABASE_ID=(default)
      - STACKYARD_GCP_FIRESTORE_COLLECTION_ID=users
      - STACKYARD_GCP_FIRESTORE_DOCUMENT_ID=user-1
      - STACKYARD_GCP_FIRESTORE_OPERATION_ID=op-1
