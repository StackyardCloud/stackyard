services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  datacatalog-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/datacatalog-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_DATACATALOG_ENTRY_GROUP_ID=team_group
      - STACKYARD_GCP_DATACATALOG_ENTRY_ID=orders
      - STACKYARD_GCP_DATACATALOG_TAG_TEMPLATE_ID=dataset_template
      - STACKYARD_GCP_DATACATALOG_TAG_TEMPLATE_FIELD_ID=domain
      - STACKYARD_GCP_DATACATALOG_RENAMED_FIELD_ID=domain_v2
      - STACKYARD_GCP_DATACATALOG_TAG_ID=tag-1
      - STACKYARD_GCP_DATACATALOG_ORGANIZATION_ID=123456789
