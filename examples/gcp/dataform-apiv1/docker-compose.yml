services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  dataform-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/dataform-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_DATAFORM_REPOSITORY_ID=team-repo
      - STACKYARD_GCP_DATAFORM_WORKSPACE_ID=dev
      - STACKYARD_GCP_DATAFORM_RELEASE_CONFIG_ID=daily-release
      - STACKYARD_GCP_DATAFORM_COMPILATION_RESULT_ID=cr-1
      - STACKYARD_GCP_DATAFORM_WORKFLOW_CONFIG_ID=daily-workflow
      - STACKYARD_GCP_DATAFORM_WORKFLOW_INVOCATION_ID=invocation-1
