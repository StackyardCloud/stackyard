services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  kms-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/kms-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_KMS_KEY_RING_ID=team-ring
      - STACKYARD_GCP_KMS_CRYPTO_KEY_ID=app-key
      - STACKYARD_GCP_KMS_CRYPTO_KEY_VERSION_ID=1
      - STACKYARD_GCP_KMS_IMPORT_JOB_ID=import-1
