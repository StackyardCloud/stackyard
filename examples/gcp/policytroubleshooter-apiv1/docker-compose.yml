services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  policytroubleshooter-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/policytroubleshooter-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PRINCIPAL=alice@example.com
      - STACKYARD_GCP_FULL_RESOURCE_NAME=//cloudresourcemanager.googleapis.com/projects/stackyard
      - STACKYARD_GCP_PERMISSION=resourcemanager.projects.get
