services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  apikeys-apiv2:
    build:
      context: ../../../..
      dockerfile: examples/gcp/apikeys-apiv2/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PARENT=projects/stackyard/locations/global
      - STACKYARD_GCP_KEY_ID=team-key
      - STACKYARD_GCP_KEY_STRING=stackyard-demo-key
