services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  lustre-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/lustre-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_LUSTRE_INSTANCE_ID=instance-a
      - STACKYARD_GCP_LUSTRE_FILESYSTEM=fsa12345
      - STACKYARD_GCP_LUSTRE_NETWORK=projects/stackyard/global/networks/default
      - STACKYARD_GCP_LUSTRE_GCS_PATH=gs://stackyard-lustre-transfer/
