services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  run-apiv2:
    build:
      context: ../../../..
      dockerfile: examples/gcp/run-apiv2/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_RUN_SERVICE_ID=service-1
      - STACKYARD_GCP_RUN_JOB_ID=job-1
      - STACKYARD_GCP_RUN_EXECUTION_ID=execution-1
      - STACKYARD_GCP_RUN_TASK_ID=task-1
      - STACKYARD_GCP_RUN_REVISION_ID=service-1-00001
