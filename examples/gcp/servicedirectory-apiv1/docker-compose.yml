services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  servicedirectory-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/servicedirectory-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_NAMESPACE_ID=ns-1
      - STACKYARD_GCP_SERVICE_ID=svc-1
      - STACKYARD_GCP_ENDPOINT_ID=ep-1
