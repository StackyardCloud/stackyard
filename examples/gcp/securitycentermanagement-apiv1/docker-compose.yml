services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  securitycentermanagement-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/securitycentermanagement-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_SHA_MODULE_ID=sha-module-1
      - STACKYARD_GCP_ETD_MODULE_ID=etd-module-1
      - STACKYARD_GCP_SCCM_SERVICE_ID=security-health-analytics
