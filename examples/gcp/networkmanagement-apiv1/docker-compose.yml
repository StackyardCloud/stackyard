services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  networkmanagement-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/networkmanagement-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_NETWORKMANAGEMENT_TEST_ID=reachability-test-a
      - STACKYARD_GCP_NETWORKMANAGEMENT_FLOW_LOGS_CONFIG_ID=flow-logs-a
