services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  edgecontainer-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/edgecontainer-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_EDGECONTAINER_CLUSTER_ID=team-cluster
      - STACKYARD_GCP_EDGECONTAINER_NODE_POOL_ID=default-pool
      - STACKYARD_GCP_EDGECONTAINER_SITE_NAME=projects/stackyard/locations/us-central1/zones/us-central1-a/sites/site-a
      - STACKYARD_GCP_EDGECONTAINER_MACHINE_ID=machine-1
      - STACKYARD_GCP_EDGECONTAINER_VPN_CONNECTION_ID=vpn-1
      - STACKYARD_GCP_EDGECONTAINER_OPERATION_ID=op-1
