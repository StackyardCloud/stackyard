services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  appengine-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/appengine-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_APP_ID=stackyard
      - STACKYARD_GCP_SERVICE_ID=default
      - STACKYARD_GCP_VERSION_ID=v1
      - STACKYARD_GCP_INSTANCE_ID=i-1
