services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  notebooks-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/notebooks-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_NOTEBOOKS_INSTANCE_ID=instance-1
      - STACKYARD_GCP_NOTEBOOKS_ENVIRONMENT_ID=environment-1
      - STACKYARD_GCP_NOTEBOOKS_SCHEDULE_ID=schedule-1
      - STACKYARD_GCP_NOTEBOOKS_EXECUTION_ID=execution-1
      - STACKYARD_GCP_NOTEBOOKS_RUNTIME_ID=runtime-1
      - STACKYARD_GCP_NOTEBOOKS_RUNTIME_VM_ID=vm-1
