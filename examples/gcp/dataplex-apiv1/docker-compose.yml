services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  dataplex-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/dataplex-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_DATAPLEX_LAKE_ID=team-lake
      - STACKYARD_GCP_DATAPLEX_ZONE_ID=raw-zone
      - STACKYARD_GCP_DATAPLEX_ASSET_ID=raw-asset
      - STACKYARD_GCP_DATAPLEX_TASK_ID=profile-task
      - STACKYARD_GCP_DATAPLEX_JOB_ID=job-1
      - STACKYARD_GCP_DATAPLEX_ENVIRONMENT_ID=analytics
