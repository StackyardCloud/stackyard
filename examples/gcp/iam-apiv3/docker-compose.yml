services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  iam-apiv3:
    build:
      context: ../../../..
      dockerfile: examples/gcp/iam-apiv3/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=global
      - STACKYARD_GCP_IAMV3_POLICY_BINDING_ID=binding-a
      - STACKYARD_GCP_IAMV3_ORGANIZATION_ID=123456789012
      - STACKYARD_GCP_IAMV3_PAB_ID=pab-a
      - STACKYARD_GCP_IAMV3_OPERATION_NAME=operations/op-1
