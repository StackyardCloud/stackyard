services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  gkehub-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/gkehub-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=global
      - STACKYARD_GCP_GKEHUB_MEMBERSHIP_ID=cluster-a
      - STACKYARD_GCP_GKEHUB_OPERATION_ID=op-1
