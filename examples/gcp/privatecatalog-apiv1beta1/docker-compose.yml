services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  privatecatalog-apiv1beta1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/privatecatalog-apiv1beta1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_PRIVATECATALOG_RESOURCE=projects/stackyard
      - STACKYARD_GCP_PRIVATECATALOG_CATALOG_NAME=catalogs/default-catalog
      - STACKYARD_GCP_PRIVATECATALOG_PRODUCT_NAME=catalogs/default-catalog/products/default-product
