services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  netapp-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/netapp-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_NETAPP_STORAGE_POOL_ID=pool-a
      - STACKYARD_GCP_NETAPP_VOLUME_ID=vol-a
      - STACKYARD_GCP_NETAPP_BACKUP_VAULT_ID=vault-a
