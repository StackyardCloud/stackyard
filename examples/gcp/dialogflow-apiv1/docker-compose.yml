services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  dialogflow-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/dialogflow-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_DIALOGFLOW_AGENT_DISPLAY_NAME=Stackyard Agent
      - STACKYARD_GCP_DIALOGFLOW_INTENT_ID=intent-1
      - STACKYARD_GCP_DIALOGFLOW_SESSION_ID=session-1
      - STACKYARD_GCP_DIALOGFLOW_OPERATION_ID=op-1
