services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  trace-apiv2:
    build:
      context: ../../../..
      dockerfile: examples/gcp/trace-apiv2/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_TRACE_ID=0123456789abcdef0123456789abcdef
      - STACKYARD_GCP_SPAN_ID=1111111111111111
      - STACKYARD_GCP_BATCH_SPAN_ID=2222222222222222
