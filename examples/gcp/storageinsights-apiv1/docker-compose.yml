services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  storageinsights-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/storageinsights-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION_ID=us-central1
      - STACKYARD_GCP_STORAGE_INSIGHTS_REPORT_CONFIG_ID=reportconfig1
      - STACKYARD_GCP_STORAGE_INSIGHTS_DATASET_CONFIG_ID=datasetconfig1
