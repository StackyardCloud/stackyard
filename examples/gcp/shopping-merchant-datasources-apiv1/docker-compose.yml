services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  shopping-merchant-datasources-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/shopping-merchant-datasources-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MERCHANT_DATASOURCES_ACCOUNT_ID=123456
      - STACKYARD_GCP_MERCHANT_DATASOURCES_DISPLAY_NAME=Stackyard Created Data Source
      - STACKYARD_GCP_MERCHANT_DATASOURCES_FEED_LABEL=US
      - STACKYARD_GCP_MERCHANT_DATASOURCES_CONTENT_LANGUAGE=en
