services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  parallelstore-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/parallelstore-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1-c
      - STACKYARD_GCP_PARALLELSTORE_INSTANCE_ID=instance-a
      - STACKYARD_GCP_PARALLELSTORE_NETWORK=projects/stackyard/global/networks/default
      - STACKYARD_GCP_PARALLELSTORE_GCS_URI=gs://stackyard-parallelstore-transfer/
