services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  shopping-merchant-reviews-apiv1beta:
    build:
      context: ../../../..
      dockerfile: examples/gcp/shopping-merchant-reviews-apiv1beta/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_MERCHANT_REVIEWS_ACCOUNT_ID=123456
      - STACKYARD_GCP_MERCHANT_REVIEWS_DATASOURCE_ID=104628
      - STACKYARD_GCP_MERCHANT_REVIEWS_MERCHANT_REVIEW_ID=merchant-review-1001
      - STACKYARD_GCP_MERCHANT_REVIEWS_PRODUCT_REVIEW_ID=product-review-1001
