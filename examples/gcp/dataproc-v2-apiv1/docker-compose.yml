services:
  stackyard:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug
      - STACKYARD_PROVIDERS=aws,gcp
      - STACKYARD_GCP_AUTH_MODE=emulator

  dataproc-v2-apiv1:
    build:
      context: ../../../..
      dockerfile: examples/gcp/dataproc-v2-apiv1/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_GCP_PROJECT_ID=stackyard
      - STACKYARD_GCP_LOCATION=us-central1
      - STACKYARD_GCP_DATAPROC_V2_BATCH_ID=team-batch
      - STACKYARD_GCP_DATAPROC_V2_SESSION_ID=interactive-1
      - STACKYARD_GCP_DATAPROC_V2_TEMPLATE_ID=analytics-template
      - STACKYARD_GCP_DATAPROC_V2_OPERATION_ID=operation-1
