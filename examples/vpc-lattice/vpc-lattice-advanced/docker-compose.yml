services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  vpc-lattice-advanced:
    build:
      context: ../../..
      dockerfile: examples/vpc-lattice/vpc-lattice-advanced/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - AWS_REGION=us-east-1
      - STACKYARD_SERVICE_ID=svc-00000000000000001
      - STACKYARD_LISTENER_ID=listener-00000000000000001
      - STACKYARD_TARGET_GROUP_ID=tg-00000000000000001
      - STACKYARD_SERVICE_NETWORK_ID=sn-00000000000000001
