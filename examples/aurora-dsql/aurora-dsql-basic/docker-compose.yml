services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  aurora-dsql-basic:
    build:
      context: ../../..
      dockerfile: examples/aurora-dsql/aurora-dsql-basic/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_CLUSTER_ID=aurora-dsql-basic-cluster
