services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  partner-central-advanced:
    build:
      context: ../../..
      dockerfile: examples/partner-central/partner-central-advanced/Dockerfile
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - AWS_REGION=us-east-1
    depends_on:
      - stackyard
