services:
  stackyard:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: stackyard
    ports:
      - "4566:4566"
    environment:
      - STACKYARD_LOG_LEVEL=debug

  eks-advanced:
    build:
      context: ../../..
      dockerfile: examples/eks/eks-advanced/Dockerfile
    depends_on:
      - stackyard
    environment:
      - STACKYARD_ENDPOINT=http://stackyard:4566
      - STACKYARD_CLUSTER_NAME=eks-advanced-cluster
      - STACKYARD_NODEGROUP_NAME=eks-advanced-nodegroup
      - STACKYARD_ROLE_ARN=arn:aws:iam::123456789012:role/stackyard-eks
      - STACKYARD_CLUSTER_ARN=arn:aws:eks:us-east-1:123456789012:cluster/eks-advanced-cluster
