name: Coverage Script

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-all:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Verify AWS CLI
        run: aws --version

      - name: Run endpoint coverage
        env:
          AWS_ACCESS_KEY_ID: stackyard
          AWS_SECRET_ACCESS_KEY: stackyard
          AWS_REGION: us-east-1
        run: make coverage-all
