name: Coverage Script

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-all:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AWS CLI v2
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) AWSCLI_ZIP="awscli-exe-linux-x86_64.zip" ;;
            aarch64|arm64) AWSCLI_ZIP="awscli-exe-linux-aarch64.zip" ;;
            *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL "https://awscli.amazonaws.com/${AWSCLI_ZIP}" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Verify AWS CLI
        run: |
          aws --version
          aws --version 2>&1 | grep -q "aws-cli/2."

      - name: Run endpoint coverage
        env:
          AWS_ACCESS_KEY_ID: stackyard
          AWS_SECRET_ACCESS_KEY: stackyard
          AWS_REGION: us-east-1
        run: make coverage-all
