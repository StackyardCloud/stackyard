name: Nightly Provider Contracts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-provider-contracts
  cancel-in-progress: false

jobs:
  provider-contracts:
    name: ${{ matrix.provider }} / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: aws
            suite: contracts-1-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=0
          - provider: aws
            suite: contracts-2-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=1
          - provider: aws
            suite: contracts-3-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=2
          - provider: aws
            suite: contracts-4-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=3
          - provider: aws
            suite: contracts-5-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=4
          - provider: aws
            suite: contracts-6-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=5
          - provider: aws
            suite: contracts-7-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=6
          - provider: aws
            suite: contracts-8-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=7
          - provider: aws
            suite: contracts-9-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=8
          - provider: aws
            suite: contracts-10-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=9
          - provider: aws
            suite: contracts-11-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=10
          - provider: aws
            suite: contracts-12-of-12
            target: aws-provider-contracts-nightly-contracts
            make_vars: AWS_CONTRACT_SHARD_COUNT=12 AWS_CONTRACT_SHARD_INDEX=11
          - provider: aws
            suite: io-1-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=0
          - provider: aws
            suite: io-2-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=1
          - provider: aws
            suite: io-3-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=2
          - provider: aws
            suite: io-4-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=3
          - provider: aws
            suite: io-5-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=4
          - provider: aws
            suite: io-6-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=5
          - provider: aws
            suite: io-7-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=6
          - provider: aws
            suite: io-8-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=7
          - provider: aws
            suite: io-9-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=8
          - provider: aws
            suite: io-10-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=9
          - provider: aws
            suite: io-11-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=10
          - provider: aws
            suite: io-12-of-12
            target: aws-provider-contracts-nightly-io
            make_vars: AWS_IO_SHARD_COUNT=12 AWS_IO_SHARD_INDEX=11
          - provider: aws
            suite: docs
            target: aws-provider-contracts-nightly-docs
            make_vars: ""
          - provider: azure
            suite: contracts
            target: azure-provider-contracts-nightly-contracts
            make_vars: ""
          - provider: azure
            suite: io
            target: azure-provider-contracts-nightly-io
            make_vars: ""
          - provider: azure
            suite: docs
            target: azure-provider-contracts-nightly-docs
            make_vars: ""
          - provider: azure
            suite: endpoints
            target: azure-provider-contracts-nightly-endpoints
            make_vars: ""
          - provider: gcp
            suite: contracts
            target: gcp-provider-contracts-nightly-contracts
            make_vars: ""
          - provider: gcp
            suite: io
            target: gcp-provider-contracts-nightly-io
            make_vars: ""
          - provider: gcp
            suite: docs
            target: gcp-provider-contracts-nightly-docs
            make_vars: ""
          - provider: gcp
            suite: endpoints
            target: gcp-provider-contracts-nightly-endpoints
            make_vars: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install AWS CLI v2
        if: matrix.provider == 'aws'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) aws_arch="x86_64" ;;
            aarch64|arm64) aws_arch="aarch64" ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" -o /tmp/awscliv2.zip
          rm -rf /tmp/aws
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          aws --version

      - name: Run nightly provider contract task
        run: |
          set -euo pipefail
          mkdir -p reports
          make ${{ matrix.make_vars }} "${{ matrix.target }}" 2>&1 | tee "reports/${{ matrix.provider }}-${{ matrix.suite }}-provider-contracts.log"

      - name: Upload provider contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-provider-contracts-${{ matrix.provider }}-${{ matrix.suite }}
          path: reports/${{ matrix.provider }}-${{ matrix.suite }}-provider-contracts.log
