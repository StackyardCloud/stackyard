name: Nightly Provider Contracts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-provider-contracts
  cancel-in-progress: false

jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: aws
            target: aws-provider-contracts-nightly
          - provider: azure
            target: azure-provider-contracts-nightly
          - provider: gcp
            target: gcp-provider-contracts-nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install AWS CLI v2
        if: matrix.provider == 'aws'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) aws_arch="x86_64" ;;
            aarch64|arm64) aws_arch="aarch64" ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" -o /tmp/awscliv2.zip
          rm -rf /tmp/aws
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          aws --version

      - name: Run nightly provider contract suite
        run: |
          set -euo pipefail
          mkdir -p reports
          make "${{ matrix.target }}" 2>&1 | tee "reports/${{ matrix.provider }}-provider-contracts.log"

      - name: Upload provider contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-provider-contracts-${{ matrix.provider }}
          path: reports/${{ matrix.provider }}-provider-contracts.log
