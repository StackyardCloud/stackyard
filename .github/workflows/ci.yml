name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run tests
        run: |
          chmod +x scripts/ci.sh
          ./scripts/ci.sh
      - name: Run provider contract PR suite
        run: make provider-contracts-pr
