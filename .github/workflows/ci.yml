name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check example Docker build paths
        run: python3 scripts/check-example-docker.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run tests
        run: |
          chmod +x scripts/ci.sh
          ./scripts/ci.sh
      - name: Run provider contract PR suite
        run: make provider-contracts-pr
